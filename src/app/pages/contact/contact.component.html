<section class="contact-page">
  <div class="container">
    <div class="contact-hero">
      <div>
        <p class="eyebrow">Contact</p>
        <h1 class="section-title">Parlons de votre projet</h1>
        <p class="section-subtitle">
          Appel ou rendez-vous avec un conseiller pour vous présenter nos solutions SPC et panneaux acoustiques.
        </p>
        <div class="contact-actions">
          <a class="btn btn-primary">+221 77 429 37 57</a>
        </div>
      </div>
      <div class="contact-card">
        <h4>Envoyer un message</h4>
        <form class="contact-form">
          <label>
            <span>Nom et prénom</span>
            <input type="text" name="name"/>
          </label>
          <label>
            <span>Email ou téléphone</span>
            <input type="text" name="contact"/>
          </label>
          <label>
            <span>Votre besoin</span>
            <textarea name="message" rows="3"></textarea>
          </label>
          <button type="button" class="btn btn-primary btn-block">Envoyer</button>
        </form>
      </div>
    </div>
  </div>
</section>
