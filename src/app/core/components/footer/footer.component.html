<footer class="footer" id="contact">
  <div class="container footer__grid">
    <div class="footer__brand">
      <img [src]="logoUrl" alt="SopiKër" loading="lazy" />
      <p>Revêtements SPC et panneaux acoustiques pour des espaces durables et élégants.</p>
    </div>
    <div class="footer__columns">
      <div class="footer__column" *ngFor="let column of columns">
        <h3 class="footer-heading page-subtitle">{{ column.title }}</h3>
        <ng-container *ngFor="let item of column.items">
          <a class="footer__link" *ngIf="item.type === 'href'" [href]="item.href">{{ item.label }}</a>
          <a class="footer__link" *ngIf="item.type === 'router'" [routerLink]="item.to">{{ item.label }}</a>
          <span class="footer__text" *ngIf="item.type === 'text'">{{ item.label }}</span>
        </ng-container>
      </div>
    </div>
  </div>
  <div class="footer__bottom">
    <div class="container footer__bottom-bar">
      <p>© 2025 SopiKër. Tous droits réservés.</p>
      <div class="footer__legal">
        <a routerLink="/cgv/">CGV</a>
        <a routerLink="/mentions-legales/">Mentions légales</a>
        <a routerLink="/confidentialite/">Confidentialité</a>
      </div>
    </div>
  </div>
</footer>
