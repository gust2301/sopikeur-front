<footer class="footer" id="contact">
  <div class="footer__content">
    <div class="footer__column" *ngFor="let column of columns">
      <h4>{{ column.title }}</h4>
      <ul>
        <li *ngFor="let link of column.links"><a [href]="link.href">{{ link.label }}</a></li>
      </ul>
    </div>
  </div>
  <div class="footer__bottom">
    <p>
      © 2025 Sopi Keur. Tous droits réservés. |
      <a href="#" aria-label="Conditions générales de vente">CGV</a> |
      <a href="#" aria-label="Mentions légales">Mentions légales</a>
    </p>
  </div>
</footer>
