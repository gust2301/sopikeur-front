<header class="header" aria-label="Navigation principale">
  <div class="container header__bar">
    <a class="header__brand" routerLink="/" fragment="home" aria-label="Retour à l’accueil">
      <img src="assets/logos/sopi_ker_logo_dark_500w.png" alt="SopiKër" loading="lazy" />
    </a>

    <div class="nav-desktop">
      <nav class="header__nav" aria-label="Sections principales">
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.path"
          [fragment]="link.fragment"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="link.exact ? { exact: true } : { exact: false }"
          class="nav-link" [class.nav-link--featured]="link.featured"
        >
          {{ link.label }}
        </a>
      </nav>
    </div>

    <div class="nav-mobile">
      <button
        class="menu-toggle menu-btn button-reset"
        type="button"
        aria-label="Ouvrir le menu"
        aria-controls="mobile-drawer"
        [attr.aria-expanded]="isMobileMenuOpen"
        (click)="toggleMenu()"
      >
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
      </button>

      <div class="mobile-menu" [class.is-open]="isMobileMenuOpen">
        <button class="mobile-menu__overlay" type="button" (click)="closeMenu()" aria-label="Fermer le menu"></button>
        <aside class="mobile-menu__drawer" id="mobile-drawer" role="dialog" aria-modal="true">
          <div class="mobile-menu__header">
            <span class="mobile-menu__title">Navigation</span>
            <button class="mobile-menu__close button-reset" type="button" aria-label="Fermer le menu" (click)="closeMenu()">
              ✕
            </button>
          </div>
          <nav class="mobile-menu__nav" aria-label="Navigation mobile">
            <a
              *ngFor="let link of navLinks"
              [routerLink]="link.path"
              [fragment]="link.fragment"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="link.exact ? { exact: true } : { exact: false }"
              class="mobile-menu__link" [class.mobile-menu__link--featured]="link.featured"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </nav>
        </aside>
      </div>
    </div>
  </div>
</header>
