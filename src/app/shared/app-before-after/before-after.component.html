<div class="ba" role="region" aria-label="Comparateur avant après">
  <!-- Couche AVANT -->
  <div class="img before"
       [style.background-image]="beforeBg"
       [style.background-size]="beforeSize"
       [style.background-position]="beforePos">
  </div>

  <div class="img after"
       [style.background-image]="afterBg"
       [style.background-size]="afterSize"
       [style.background-position]="afterPos"
       [style.clipPath]="'inset(0 0 0 ' + positionPct + '%)'">
  </div>
  <!-- Poignée -->
  <div class="handle" [style.left.%]="positionPct" (pointerdown)="startDrag($event)">
    <span class="bar" aria-hidden="true"></span>
    <span class="knob" aria-label="Glisser horizontalement pour comparer"></span>
  </div>
</div>
